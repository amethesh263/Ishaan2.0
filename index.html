<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Monster Walker</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#87c96b}
#game{position:relative;width:100vw;height:100vh;overflow:hidden;background:#8fd16b;touch-action:none}
#world{position:absolute;left:50%;top:50%;width:2400px;height:1800px;transform:translate(-50%,-50%);background:#9bd875;overflow:hidden}
.grass{position:absolute;inset:0;background-image:
 radial-gradient(circle at 20% 30%,rgba(50,130,55,.15) 0 3px,transparent 4px),
 radial-gradient(circle at 70% 60%,rgba(50,130,55,.12) 0 3px,transparent 4px);
 background-size:85px 85px,110px 110px}
.road{position:absolute;background:#d8c79b;border:5px solid #c2ad7d;box-shadow:inset 0 0 0 4px rgba(255,255,255,.18)}
.road.h{height:130px;width:100%;top:720px}
.road.v{width:130px;height:100%;left:1135px}
.park{position:absolute;width:330px;height:240px;border-radius:45px;background:#78bd62;border:6px solid #66a954}
.tree{position:absolute;width:54px;height:54px;border-radius:50%;background:#318e45;border:7px solid #25753a;box-shadow:0 7px 0 #246b36}
.pond{position:absolute;width:360px;height:220px;border-radius:50%;background:#55bfe1;border:8px solid #398fb1}
.building{position:absolute;border-radius:12px;background:#e8a36f;border:7px solid #bd754c;box-shadow:0 7px 0 rgba(0,0,0,.12)}
#player{position:absolute;width:58px;height:58px;border-radius:50%;background:#4b75e8;border:6px solid white;box-shadow:0 4px 10px #234;z-index:10;display:flex;align-items:center;justify-content:center;font-size:28px}
#player .face{filter:drop-shadow(0 1px 1px #234)}
.marker{position:absolute;width:58px;height:58px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#ffcc38;border:5px solid white;box-shadow:0 4px 8px #777;z-index:5;cursor:pointer}
.marker span{display:block;transform:rotate(45deg);font-size:26px;text-align:center;margin-top:9px}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;z-index:30}
.card{background:rgba(255,255,255,.92);border-radius:16px;padding:10px 14px;box-shadow:0 3px 12px rgba(0,0,0,.2);font-weight:bold}
#message{position:absolute;top:75px;left:50%;transform:translateX(-50%);background:rgba(20,30,40,.88);color:#fff;padding:10px 18px;border-radius:20px;z-index:40;opacity:0;transition:.25s;pointer-events:none}
#message.show{opacity:1}
#joystick{position:absolute;left:25px;bottom:25px;width:145px;height:145px;border-radius:50%;background:rgba(255,255,255,.3);border:4px solid rgba(255,255,255,.7);z-index:50}
#stick{position:absolute;left:50%;top:50%;width:70px;height:70px;transform:translate(-50%,-50%);border-radius:50%;background:rgba(55,80,110,.8);border:5px solid rgba(255,255,255,.8);box-shadow:0 4px 10px rgba(0,0,0,.25)}
#hint{position:absolute;right:18px;bottom:25px;background:rgba(255,255,255,.9);padding:12px 16px;border-radius:15px;z-index:20;max-width:210px}
@media(max-width:600px){#hint{display:none}.card{font-size:14px}.road.h{height:110px;top:720px}.road.v{width:110px;left:1145px}}
</style>
</head>
<body>
<div id="game">
  <div id="world">
    <div class="grass"></div>
    <div class="road h"></div><div class="road v"></div>
    <div class="park" style="left:220px;top:220px"></div>
    <div class="pond" style="left:1660px;top:300px"></div>
    <div class="building" style="left:350px;top:1050px;width:260px;height:190px"></div>
    <div class="building" style="left:1600px;top:1020px;width:300px;height:220px"></div>
    <div class="building" style="left:700px;top:350px;width:230px;height:160px"></div>
    <div id="trees"></div>
    <div class="marker" data-name="Wild Spark" style="left:450px;top:550px"><span>⚡</span></div>
    <div class="marker" data-name="Leafy Buddy" style="left:1740px;top:620px"><span>🌿</span></div>
    <div class="marker" data-name="Water Friend" style="left:850px;top:1260px"><span>💧</span></div>
    <div class="marker" data-name="Fire Friend" style="left:2050px;top:1050px"><span>🔥</span></div>
    <div id="player"><span class="face">🧢</span></div>
  </div>

  <div id="hud">
    <div class="card">⭐ XP: <span id="xp">0</span></div>
    <div class="card">🪙 <span id="coins">0</span></div>
  </div>
  <div id="message"></div>
  <div id="hint">🕹️ Drag the joystick to walk around the world.<br><br>Get close to the markers to collect them!</div>
  <div id="joystick"><div id="stick"></div></div>
</div>

<script>
const world=document.getElementById("world");
const player=document.getElementById("player");
const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");
const xpEl=document.getElementById("xp"), coinsEl=document.getElementById("coins");
const msg=document.getElementById("message");

let px=1170, py=820, xp=0, coins=0;
let joy={x:0,y:0,active:false,id:null};
const speed=3.8;
const W=2400,H=1800;

function makeTrees(){
  const positions=[
    [120,120],[280,90],[520,170],[820,110],[1260,120],[1500,150],[1960,130],[2200,230],
    [120,500],[240,620],[980,620],[1400,560],[2180,520],[120,980],[280,1360],
    [650,1480],[1100,1400],[1450,1450],[1980,1380],[2200,1500]
  ];
  positions.forEach(([x,y])=>{
    const t=document.createElement("div"); t.className="tree"; t.style.left=x+"px"; t.style.top=y+"px"; world.appendChild(t);
  });
}
makeTrees();

function showMessage(text){
  msg.textContent=text; msg.classList.add("show");
  clearTimeout(showMessage.t); showMessage.t=setTimeout(()=>msg.classList.remove("show"),1800);
}
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function update(){
  px=clamp(px+joy.x*speed,30,W-30);
  py=clamp(py+joy.y*speed,30,H-30);
  player.style.left=(px-29)+"px"; player.style.top=(py-29)+"px";

  // Camera follows player
  const cx=innerWidth/2-px, cy=innerHeight/2-py;
  world.style.transform=`translate(calc(-50% + ${cx}px),calc(-50% + ${cy}px))`;

  document.querySelectorAll(".marker").forEach(m=>{
    if(m.dataset.collected) return;
    const mx=parseFloat(m.style.left)+29, my=parseFloat(m.style.top)+29;
    const d=Math.hypot(mx-px,my-py);
    if(d<75){
      m.dataset.collected="1";
      m.style.opacity=".35"; m.style.pointerEvents="none";
      xp+=25; coins+=5; xpEl.textContent=xp; coinsEl.textContent=coins;
      showMessage("🎉 You found "+m.dataset.name+"! +25 XP");
    }
  });
  requestAnimationFrame(update);
}
function setJoy(clientX,clientY){
  const r=joystick.getBoundingClientRect();
  let dx=clientX-(r.left+r.width/2), dy=clientY-(r.top+r.height/2);
  const max=r.width/2-38;
  const dist=Math.hypot(dx,dy);
  if(dist>max){dx=dx/dist*max;dy=dy/dist*max}
  stick.style.left=`calc(50% + ${dx}px)`;
  stick.style.top=`calc(50% + ${dy}px)`;
  joy.x=dx/max; joy.y=dy/max;
}
function resetJoy(){
  joy.x=0;joy.y=0;joy.active=false;
  stick.style.left="50%";stick.style.top="50%";
}
joystick.addEventListener("pointerdown",e=>{
  e.preventDefault(); joy.active=true; joy.id=e.pointerId;
  joystick.setPointerCapture(e.pointerId); setJoy(e.clientX,e.clientY);
});
joystick.addEventListener("pointermove",e=>{if(joy.active&&e.pointerId===joy.id)setJoy(e.clientX,e.clientY)});
joystick.addEventListener("pointerup",resetJoy);
joystick.addEventListener("pointercancel",resetJoy);

window.addEventListener("keydown",e=>{
  if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")joy.y=-1;
  if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")joy.y=1;
  if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")joy.x=-1;
  if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")joy.x=1;
});
window.addEventListener("keyup",e=>{
  if(["ArrowUp","ArrowDown","w","a","s","d"].includes(e.key))resetJoy();
});

window.addEventListener("resize",()=>{});
showMessage("🗺️ Explore the world!");
update();
</script>
</body>
</html>
